<style>
/* Layout: estante de libros a la izquierda (chips arriba en móvil), cuaderno del libro a la derecha con pestañas Resumen / Subrayados / Agregar. */

    --hl: rgba(255, 220, 120, .28); --ok: #93D4B2; --ok-soft: #1F3029; --warn: #F5BE95; --warn-soft: #3A2A22; --danger: #F4A3B5;

}
:root[data-theme="dark"] {

  --accent: #BBAEF2; --accent-ink: #1A1824; --accent-soft: #2E2945; --practice: #1E3029; --practice-ink: #A3DCC0;
  --hl: rgba(255, 220, 120, .28); --ok: #93D4B2; --ok-soft: #1F3029; --warn: #F5BE95; --warn-soft: #3A2A22; --danger: #F4A3B5;

.thesis { font-family: var(--font-display); font-size: 1.3rem; line-height: 1.45; margin: 0; max-width: 62ch; }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 6px; }

.progress { display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.themes { display: flex; flex-direction: column; gap: 16px; }
.theme { border-top: 1px solid var(--line); padding-top: 18px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 14px 28px; }
@media (max-width: 900px) { .theme { grid-template-columns: minmax(0, 1fr); } }
.theme h3 { font-size: 1.2rem; font-weight: 600; grid-column: 1 / -1; }
.theme .explain { margin: 0; max-width: 62ch; }
.theme dl { margin: 10px 0 0; display: flex; flex-direction: column; gap: 10px; max-width: 62ch; }
.theme dt { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.action { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem; }

details.quotes { grid-column: 1 / -1; }

.quote { font-family: var(--font-display); margin: 10px 0 0; padding-left: 14px; border-left: 2px solid var(--line); max-width: 62ch; }
.loc { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); }

.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 900px) { .two { grid-template-columns: minmax(0, 1fr); } }

.card .q { font-weight: 500; }
.card .a { margin-top: 6px; color: var(--muted); }
.card .hint { font-size: .75rem; color: var(--accent); margin-top: 4px; }

.hl-list { display: flex; flex-direction: column; }
.hl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.hl:last-child { border-bottom: none; }
.hl .text { font-family: var(--font-display); max-width: 66ch; }
.hl .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hl .note { font-size: .88rem; color: var(--muted); }
.hl .note b { color: var(--ink); font-weight: 600; }

.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: .82rem; font-weight: 600; }
.field .help { font-size: .8rem; color: var(--muted); }
input[type="text"], textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 8px 10px; }
textarea { min-height: 160px; resize: vertical; font-family: var(--font-display); }
.drop { border: 1px dashed var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }

.found { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.found-item { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }

details.howto summary { cursor: pointer; font-weight: 500; }

.gen { display: flex; flex-direction: column; gap: 8px; }
.gen-out { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); max-height: 120px; overflow: auto; white-space: pre-wrap; word-break: break-word; background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.spinner { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

.empty { text-align: left; color: var(--muted); padding: 8px 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: .88rem; max-width: calc(100% - 32px); }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Book <span class="mark">Seed</span></h1><p class="tagline">Turn what you read into what you do</p></div>
    <div class="status" id="status"><span class="dot"></span><span>Loading…</span></div>
  </header>
  <div class="layout">
    <aside class="shelf" id="shelf"></aside>
    <main class="notebook" id="nb"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";

/* ---------- Example (Marcus Aurelius, public domain; free rendering) ---------- */
const EXAMPLE = {
  id: "ejemplo", isExample: true,
  title: "Meditations", author: "Marcus Aurelius",
  goal: "Stay calm at work when things get complicated",
  nextId: 7,
  highlights: [
    { id: "h1", loc: "Book II, 1", text: "Begin the morning by saying to yourself: today I shall meet with the busybody, the ungrateful, the arrogant. None of them can harm me, for no one can drag me into what is shameful." },
    { id: "h2", loc: "Book IV, 3", text: "People seek retreats for themselves in the country, by the sea, in the mountains. But nowhere can a person retreat with more quiet than into their own soul." },
    { id: "h3", loc: "Book IV, 7", text: "Take away your opinion, and you take away the complaint, “I have been harmed.” Take away the complaint, and the harm is gone.", note: "This helps me in difficult meetings." },
    { id: "h4", loc: "Book V, 1", text: "In the morning, when you find it hard to get up, keep this thought ready: I am rising to do the work of a human being." },
    { id: "h5", loc: "Book VI, 6", text: "The best revenge is not to be like the one who wronged you." },
    { id: "h6", loc: "Book VIII, 36", text: "Do not let the picture of your whole life trouble you. Do not dwell on all the hardships that may come; instead ask, in each present case: what is there here that is unbearable?" }
  ],
  summarized: ["h1","h2","h3","h4","h5","h6"],
  done: { a2: true },
  summary: {
    idea_central: "You can't control what happens or what other people do, but you can control how you interpret it and how you respond. That is where your calm lives.",
    temas: [
      { id: "t1", titulo: "The harm is in the interpretation", explicacion: "Often what upsets us isn't the event itself but the story we tell about it. Separate the fact from your judgment and the emotion loses its grip.", por_que_importa: "It lets you respond clearly instead of reacting in the heat of the moment.", ejemplo: "A colleague criticizes your report in a meeting. Fact: they pointed out two errors. Judgment: “they made me look foolish.” Keep the fact and fix the two errors.", subrayados: ["h3","h5"],
        acciones: [ { id: "a1", texto: "Write “fact / my judgment” in two columns the next time something bothers you", cuando: "In the moment, or at the end of the day" }, { id: "a2", texto: "Wait 10 minutes before replying to an email that irritates you", cuando: "This week" } ] },
      { id: "t2", titulo: "Prepare for the day", explicacion: "Marcus Aurelius started each day expecting to meet difficult people. Not to become bitter, but so they wouldn't catch him off guard.", por_que_importa: "What you anticipate unsettles you less.", ejemplo: "Before opening your inbox, think about which meeting or person might test you today and how you want to behave.", subrayados: ["h1","h4"],
        acciones: [ { id: "a3", texto: "Spend 2 minutes each morning naming one challenge of the day and your ideal response", cuando: "Every morning, before email" } ] },
      { id: "t3", titulo: "One problem at a time", explicacion: "Picturing every difficulty at once is overwhelming. What is in front of you right now is almost always manageable.", por_que_importa: "It lowers anxiety and brings you back to concrete action.", ejemplo: "When a project falls behind, instead of imagining everything that could go wrong, define the next 30-minute task.", subrayados: ["h6","h2"],
        acciones: [ { id: "a4", texto: "When you feel overwhelmed, write down only the next concrete action", cuando: "Whenever the feeling shows up" } ] }
    ],
    preguntas: [ "What situation this week affected you more because of your interpretation than because of the facts?", "Where is your “inner retreat” when work gets tense?" ],
    repaso: [ { pregunta: "According to Marcus Aurelius, what do you remove to remove the harm?", respuesta: "Your opinion or judgment about what happened." }, { pregunta: "What question does he suggest when facing hardship?", respuesta: "What is there here, in the present, that is unbearable?" } ]
  }
};

/* ---------- Estado ---------- */
const S = {
  books: {}, currentId: null, tab: "resumen",
  mode: "loading", db: null, uid: null, sample: null, sampleOff: false, imgOK: false, reading: null,
  draft: "", newBook: null, found: null, flipped: {}, confirmDelete: null,
  gen: null, example: JSON.parse(JSON.stringify(EXAMPLE))
};
const LS_KEY = "subrayados.v1";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3200);
}
function hash(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; return h.toString(36); }
const norm = (s) => s.toLowerCase().replace(/\s+/g, " ").trim();

function bookList() { return Object.values(S.books).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); }
function current() {
  if (S.currentId === "ejemplo" || !Object.keys(S.books).length) return S.example;
  return S.books[S.currentId] || bookList()[0];
}

/* ---------- Guardado ---------- */
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S.books)); } catch (e) {}
}
function loadLocal() {
  try { const v = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); return v && typeof v === "object" ? v : {}; } catch (e) { return {}; }
}
const timers = {}, dirty = {}, chains = {};
function col() { return S.db.collection("data/users/" + S.uid); }
function persist(book) {
  if (book.isExample) return;
  book.updatedAt = Date.now();
  if (S.mode !== "cuenta") { saveLocal(); return; }
  dirty[book.id] = true;
  clearTimeout(timers[book.id]);
  timers[book.id] = setTimeout(() => { delete timers[book.id]; flush(book.id); }, 400);
}
function flush(id) {
  chains[id] = (chains[id] || Promise.resolve()).then(async () => {
    if (!dirty[id]) return;
    dirty[id] = false;
    const b = S.books[id]; if (!b) return;
    const body = JSON.parse(JSON.stringify(b));
    if (JSON.stringify(body).length > 250000) { toast("This book has too many highlights to save in full. Delete a few."); return; }
    try { await col().doc(id).set(body); }
    catch (e) {
      if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); try { await col().doc(id).set(body); return; } catch (e2) {} }
      toast(e && e.code === "quota_exceeded" ? "No storage space left. Delete a book you no longer need." : "Couldn't save your last change. Check your connection.");
    }
  });
}
async function removeBook(id) {
  delete S.books[id];
  if (S.mode === "cuenta") { try { await col().doc(id).delete(); } catch (e) { toast("Couldn't delete the book."); } }
  else saveLocal();
}

/* ---------- Libros y subrayados ---------- */
function makeBook(title, author, goal) {
  const id = "b-" + hash(norm(title) + "|" + Date.now());
  return { id, title: title.trim(), author: (author || "").trim(), goal: (goal || "").trim(), highlights: [], summarized: [], done: {}, summary: null, nextId: 1, createdAt: Date.now(), updatedAt: Date.now() };
}
function findBookByTitle(title) {
  const t = norm(title); return Object.values(S.books).find(b => norm(b.title) === t);
}
/* Agrega con deduplicación: Kindle guarda una copia nueva cada vez que extiendes un subrayado. */
function addHighlights(book, items) {
  let added = 0;
  for (const it of items) {
    const text = (it.text || "").trim(); if (!text && !it.note) continue;
    if (!text && it.note) {
      const target = [...book.highlights].reverse().find(h => it.loc && h.loc && locMatch(h.loc, it.loc));
      if (target) { target.note = target.note ? target.note + " / " + it.note : it.note; continue; }
    }
    const n = norm(text);
    const dupe = text && book.highlights.find(h => { const hn = norm(h.text); return hn === n || hn.includes(n) || n.includes(hn); });
    if (dupe) {
      if (n.length > norm(dupe.text).length) {
        dupe.text = text; if (it.loc) dupe.loc = it.loc;
        book.summarized = book.summarized.filter(x => x !== dupe.id);
      }
      if (it.note && !dupe.note) dupe.note = it.note;
      continue;
    }
    book.highlights.push({ id: "h" + (book.nextId++), text, loc: it.loc || "", note: it.note || "", addedAt: Date.now() });
    added++;
  }
  return added;
}
function locMatch(a, b) {
  const nums = (s) => (String(s).match(/\d+/g) || []).map(Number);
  const [a1, a2] = nums(a), [b1] = nums(b);
  if (a1 == null || b1 == null) return false;
  return b1 >= a1 && b1 <= (a2 ?? a1) + 1;
}

/* ---------- Lectura de My Clippings.txt (Kindle, español e inglés) ---------- */
function parseClippings(raw) {
  const books = {};
  raw.replace(/^﻿/, "").split(/\r?\n?==========\r?\n?/).forEach(block => {
    const lines = block.split(/\r?\n/).map(l => l.replace(/^﻿/, ""));
    while (lines.length && !lines[0].trim()) lines.shift();
    if (lines.length < 2) return;
    const head = lines[0].trim(), meta = lines[1].trim();
    const text = lines.slice(2).join("\n").trim();
    if (/bookmark|marcador|signet|lesezeichen/i.test(meta)) return;
    const isNote = /\bnote\b|\bnota\b/i.test(meta) && !/highlight|subrayado|resaltado/i.test(meta);
    let title = head, author = "";
    const m = head.match(/^(.*)\(([^()]*)\)\s*$/);
    if (m) { title = m[1].trim(); author = m[2].trim(); }
    const pos = meta.match(/(?:location|posición|posicion|ubicación|ubicacion|loc\.)\s*([\d]+(?:-\d+)?)/i);
    const page = meta.match(/(?:page|página|pagina)\s*([\divxlc]+(?:-[\divxlc]+)?)/i);
    const loc = pos ? "Loc. " + pos[1] : page ? "p. " + page[1] : "";
    const key = norm(title);
    books[key] = books[key] || { title, author, items: [] };
    if (isNote) books[key].items.push({ text: "", note: text, loc });
    else books[key].items.push({ text, loc });
  });
  return Object.values(books).map(b => ({ ...b, count: b.items.filter(i => i.text).length })).filter(b => b.items.length);
}
/* Texto pegado: Apple Books (con su pie «Extracto de…»), otras apps o escrito a mano. */
const unquote = (s) => s.replace(/^[\s\-•*"“”«]+|[\s"“”»]+$/g, "").trim();
const isJunk = (l) => /copyright|derechos de autor|protegido por|^https?:\/\/\S+$|^(apple )?books\.?$|^ibooks\.?$/i.test(l)
  || /^(?:[a-záéíóú]+,?\s+)?\d{1,2}(?:\s+de)?\s+[a-záéíóú]+(?:\s+de)?\s+\d{4}$/i.test(l)   // 3 de junio de 2025
  || /^[a-z]+\s+\d{1,2},\s+\d{4}$/i.test(l) || /^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(l);
function parseGeneric(raw) {
  const clean = raw.split(/\r?\n/).filter(l => !isJunk(l.trim())).join("\n");
  const chunks = /\n\s*\n/.test(clean) ? clean.split(/\n\s*\n/) : clean.split(/\n/);
  return chunks.map(c => c.trim()).filter(c => c.length > 2).map(c => {
    const m = c.match(/^\s*(?:\[?(p(?:á|a)g(?:ina)?\.?|page|pp?\.|pos\.?|loc\.?)\s*([\d-]+)\]?[:.)\-–\s]+)/i);
    return m ? { text: unquote(c.slice(m[0].length)), loc: (/^p/i.test(m[1]) && !/^pos/i.test(m[1]) ? "p. " : "Loc. ") + m[2] } : { text: unquote(c) };
  }).filter(it => it.text);
}
function parsePasted(raw) {
  if (/==========/.test(raw)) return null; // es un My Clippings de Kindle pegado
  const lines = raw.split(/\r?\n/);
  const items = []; let buf = [], title = "", author = "";
  const flushBuf = () => { const t = unquote(buf.join("\n")); if (t) items.push({ text: t }); buf = []; };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    const m = line.match(/^(?:excerpt from|extracto de|fragmento de|extrait de|auszug aus)\b[:\s]*(.*)$/i);
    if (m) {
      flushBuf();
      if (m[1]) { // formato antiguo en una línea: Autor. “Título”. Apple Books.
        const q = m[1].match(/^(.*?)\.\s*[“"«](.+?)\.?[”"»]/);
        if (q) { author = author || q[1].trim(); title = title || q[2].trim(); }
      } else { // formato actual: título y autor en las líneas siguientes
        const t = (lines[i + 1] || "").trim(), a = (lines[i + 2] || "").trim();
        if (t && !isJunk(t)) { title = title || t; i++; if (a && !isJunk(a)) { author = author || a; i++; } }
      }
      while (i + 1 < lines.length && isJunk(lines[i + 1].trim())) i++;
      continue;
    }
    if (isJunk(line)) continue;
    buf.push(lines[i]);
  }
  if (!items.length) return { items: parseGeneric(raw), title: "", author: "" };
  if (buf.join("").trim()) items.push(...parseGeneric(buf.join("\n")));
  return { items, title, author };
}

/* ---------- Resumen con Claude ---------- */
function pendingIds(book) { const s = new Set(book.summarized); return book.highlights.filter(h => !s.has(h.id)).map(h => h.id); }

function buildPrompt(book, mode) {
  const s = new Set(book.summarized);
  const list = mode === "update" ? book.highlights.filter(h => !s.has(h.id)) : book.highlights;
  let budget = 150000, lines = [];
  for (const h of list) {
    const line = `[${h.id}]${h.loc ? " (" + h.loc + ")" : ""} ${h.text}${h.note ? "\n   Reader's note: " + h.note : ""}`;
    if ((budget -= line.length) < 0) break;
    lines.push(line);
  }
  const goal = book.goal || "understand the ideas and apply them in daily life and work";
  const shape = `{"idea_central":"...","temas":[{"id":"t1","titulo":"...","explicacion":"...","por_que_importa":"...","ejemplo":"...","subrayados":["h1","h4"],"acciones":[{"id":"a1","texto":"...","cuando":"..."}]}],"preguntas":["..."],"repaso":[{"pregunta":"...","respuesta":"..."}]}`;
  let p = `You are a great teacher. You turn a reader's highlights from a book into a practical, easy-to-learn summary, written in English, that the reader can read in a few minutes and put into practice.

Book: ${book.title}${book.author ? " — " + book.author : ""}
Reader's goal: ${goal}
`;
  if (mode === "update" && book.summary) {
    p += `
This summary already exists (JSON):
${JSON.stringify(book.summary)}

Integrate ONLY the new highlights below: expand existing themes where they fit or create new themes. Don't remove valid content. Keep the "id" of themes and actions that still exist, and use new ids (not yet used) for new themes and actions. You may rewrite the central idea if the new highlights change it. Write everything in English.
`;
  }
  p += `
${mode === "update" ? "New highlights" : "Highlights"} (the id is in square brackets):
${lines.join("\n")}

Rules:
- Simple, friendly language and short sentences, as if explaining to a friend. Write in English even if the highlights are in another language; quote nothing.
- Group by idea, not by order of appearance: between 3 and 8 themes.
- Each theme: "explicacion" in 2 to 4 sentences; "por_que_importa" in 1 sentence; a concrete "ejemplo" tied to the reader's goal; 1 to 3 concrete, checkable "acciones" (start with a verb) and "cuando" says when to do each one.
- In "subrayados" put the ids that support the theme. Use only ids shown above${mode === "update" ? " or already in the summary" : ""}.
- Don't attribute ideas to the book that aren't in the highlights; anything you add yourself should be framed as a practical suggestion.
- 2 to 4 personal reflection "preguntas" and 3 to 6 review cards in "repaso" (short question, short answer).
- Keep the JSON keys exactly as shown (they are field names); the values must be in English.

Reply only with JSON in this shape:
${shape}`;
  return { prompt: p, used: list.slice(0, lines.length).map(h => h.id) };
}

function cleanSummary(raw, book) {
  if (!raw || typeof raw !== "object" || !Array.isArray(raw.temas)) throw { code: "invalid_json" };
  const valid = new Set(book.highlights.map(h => h.id));
  const usedT = new Set(), usedA = new Set();
  let tn = 1, an = 1;
  const uniq = (id, set, prefix, next) => { id = String(id || ""); if (!/^[\w-]{1,24}$/.test(id) || set.has(id)) { do { id = prefix + next(); } while (set.has(id)); } set.add(id); return id; };
  return {
    idea_central: String(raw.idea_central || ""),
    temas: raw.temas.filter(t => t && t.titulo).map(t => ({
      id: uniq(t.id, usedT, "t", () => tn++),
      titulo: String(t.titulo), explicacion: String(t.explicacion || ""), por_que_importa: String(t.por_que_importa || ""), ejemplo: String(t.ejemplo || ""),
      subrayados: (Array.isArray(t.subrayados) ? t.subrayados : []).map(String).filter(id => valid.has(id)),
      acciones: (Array.isArray(t.acciones) ? t.acciones : []).filter(a => a && a.texto).map(a => ({ id: uniq(a.id, usedA, "a", () => an++), texto: String(a.texto), cuando: String(a.cuando || "") }))
    })),
    preguntas: (Array.isArray(raw.preguntas) ? raw.preguntas : []).map(String),
    repaso: (Array.isArray(raw.repaso) ? raw.repaso : []).filter(r => r && r.pregunta).map(r => ({ pregunta: String(r.pregunta), respuesta: String(r.respuesta || "") }))
  };
}

const ERR = {
  not_granted: "You didn't allow this page to use Claude. You can turn it on in the page's permissions menu.",
  sampling_disabled: "Claude isn't available for your account.",
  rate_limited: "You've hit the usage limit for now. Try again in a little while.",
  session_expired: "Your session expired. Sign in to Claude again.",
  prompt_too_large: "Too many highlights for one go. Try \"Update\" with fewer new highlights.",
  invalid_json: "The answer came back incomplete. Try again.",
  refused: "Claude couldn't summarize this content.",
  empty_completion: "The answer came back empty. Try again."
};
async function generate(mode) {
  const book = current();
  if (!S.sample || S.gen || book.isExample) return;
  const { prompt, used } = buildPrompt(book, mode);
  if (!used.length) { toast("There are no highlights to summarize."); return; }
  const ctl = new AbortController();
  S.gen = { bookId: book.id, ctl, text: "", mode };
  render();
  try {
    const raw = await S.sample.json(prompt, {
      signal: ctl.signal, cache: false,
      onText: ({ text }) => { if (S.gen) { S.gen.text = text; const o = $("#gen-out"); if (o) { o.textContent = text.slice(-600); o.scrollTop = o.scrollHeight; } const c = $("#gen-count"); if (c) c.textContent = text.length.toLocaleString("en") + " characters"; } }
    });
    const b = S.books[book.id]; if (!b) return;
    b.summary = cleanSummary(raw, b);
    b.summarized = mode === "update" ? Array.from(new Set([...b.summarized, ...used])) : used;
    const live = new Set(b.summary.temas.flatMap(t => t.acciones.map(a => a.id)));
    for (const k of Object.keys(b.done || {})) if (!live.has(k)) delete b.done[k];
    persist(b);
    toast(mode === "update" ? "Summary updated." : "Summary ready.");
  } catch (e) {
    const code = e && e.code;
    if (code === "not_granted" || code === "sampling_disabled" || code === "not_declared" || code === "capability_disabled" || code === "capability_removed") S.sampleOff = true;
    if (code !== "cancelled") toast(ERR[code] || "Something went wrong talking to Claude. Try again.");
  } finally {
    S.gen = null; S.tab = "resumen"; render();
  }
}

function summaryMarkdown(book) {
  const s = book.summary; if (!s) return "";
  const byId = Object.fromEntries(book.highlights.map(h => [h.id, h]));
  let md = `# ${book.title}${book.author ? " — " + book.author : ""}\n\n**Central idea:** ${s.idea_central}\n`;
  for (const t of s.temas) {
    md += `\n## ${t.titulo}\n\n${t.explicacion}\n\n**Why it matters:** ${t.por_que_importa}\n\n**Example:** ${t.ejemplo}\n\n**Put it into practice:**\n`;
    for (const a of t.acciones) md += `- [${book.done?.[a.id] ? "x" : " "}] ${a.texto}${a.cuando ? " _(" + a.cuando + ")_" : ""}\n`;
    const qs = t.subrayados.map(id => byId[id]).filter(Boolean);
    if (qs.length) md += `\n` + qs.map(h => `> ${h.text}${h.loc ? " (" + h.loc + ")" : ""}`).join("\n>\n") + "\n";
  }
  if (s.preguntas.length) md += `\n## To reflect on\n\n` + s.preguntas.map(q => `- ${q}`).join("\n") + "\n";
  if (s.repaso.length) md += `\n## Review\n\n` + s.repaso.map(r => `- **${r.pregunta}** ${r.respuesta}`).join("\n") + "\n";
  return md;
}

/* Guarda lo pegado en el libro que indica el texto; si no indica ninguno, en fallback. */
function importParsed(parsed, fallback) {
  let target = parsed.title ? findBookByTitle(parsed.title) : null;
  if (!target && parsed.title && (!fallback || norm(fallback.title) !== norm(parsed.title))) {
    target = makeBook(parsed.title, parsed.author, ""); S.books[target.id] = target;
  }
  target = target || fallback;
  if (parsed.author && !target.author) target.author = parsed.author;
  const n = addHighlights(target, parsed.items);
  S.currentId = target.id; persist(target);
  return { target, n };
}

    </div>`).join("")}</div>`;
}

function renderAdd(book) {
  if (book.isExample) return `<div class="callout warn"><p>This is the example book. Create your own book to add highlights.</p><button class="btn primary" data-act="new-book">Add my book</button></div>`;
  const found = S.found;
  return `
  <section class="field">
    <label for="paste">Paste your highlights</label>
    <span class="help">Copy your highlights in Apple Books and paste them as they are: we only strip the “Excerpt From… This material may be protected…” text the app adds. You can paste several at once. If you type them yourself, leave a blank line between each one.</span>
    <textarea id="paste" placeholder="“Discipline is choosing between what you want now and what you want most.”&#10;&#10;Excerpt From&#10;Book Title&#10;Author&#10;This material may be protected by copyright.">${esc(S.draft)}</textarea>
    <div class="row"><button class="btn primary" data-act="add-paste">Add highlights</button><span class="help" style="color:var(--muted);font-size:.8rem">If they're from another book, it's created automatically.</span></div>
  </section>
  ${screensBlock("add")}
  <details class="howto" open><summary>How to copy your highlights from Apple Books</summary>
    <ul>
      <li><b>On iPad (all at once):</b> open the book, go to <b>Bookmarks &amp; Highlights → Highlights</b>, tap <b>Select</b>, pick them all, then <b>Share → Copy</b> and paste here.</li>
      <li><b>On iPad (one by one):</b> put Books and this page side by side (Split View). Tap a highlight, choose “Copy” and paste here. Each paste is separated automatically, and nothing is lost if you switch apps.</li>
      <li><b>On Mac:</b> open the book in Books, click the notes button in the toolbar, select all (⌘A), copy (⌘C) and paste here.</li>
      <li><b>As you keep reading:</b> paste only the new highlights (or all of them again: duplicates are skipped) and tap “Update summary”.</li>
    </ul>
  </details>
  <details class="howto" ${found ? "open" : ""}><summary>Do you also have a Kindle?</summary>
  <section class="drop" id="drop" style="margin-top:10px">
    <b>Kindle file</b>
    <span class="help" style="color:var(--muted);font-size:.88rem">Upload your <span class="loc">My Clippings.txt</span> file and choose which book to import. If you upload it again later, only new highlights are added.</span>
    <label class="btn" for="file">Choose file</label>
    <input type="file" id="file" accept=".txt,text/plain" hidden>
    ${found ? `<div class="found">${found.length ? found.map((f, i) => {
      const existing = findBookByTitle(f.title);
      return `<div class="found-item"><span class="t">${esc(f.title)}${f.author ? ` <span class="loc">${esc(f.author)}</span>` : ""}</span>
        <span class="row"><span class="loc">${f.count} highlights</span>
        <button class="btn" data-import="${i}">${existing ? "Add to this book" : "Import as new book"}</button></span></div>`;
    }).join("") : `<p class="empty">We found no highlights in that file. Is it the My Clippings.txt from your Kindle?</p>`}</div>` : ""}
  </section>
  </details>
  <section class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:16px">
    <span class="loc">${book.highlights.length} highlight${book.highlights.length === 1 ? "" : "s"} · created ${new Date(book.createdAt || Date.now()).toLocaleDateString("en")}</span>
    ${S.confirmDelete === book.id
      ? `<span class="row"><span style="font-size:.88rem">Delete this book and its summary?</span><button class="btn danger" data-act="delete-yes">Yes, delete</button><button class="btn ghost" data-act="delete-no">Cancel</button></span>`
      : `<button class="btn ghost danger" data-act="delete-ask">Delete this book</button>`}
  </section>`;
}

function render() {
  renderStatus();
  renderShelf();
  const nb = $("#nb");
  if (S.newBook) { nb.innerHTML = renderNewBookForm(); return; }
  const book = current();
  const pend = book.isExample ? 0 : pendingIds(book).length;
  const body = S.tab === "subrayados" ? renderHighlights(book) : S.tab === "agregar" ? renderAdd(book) : renderSummary(book);
  nb.innerHTML = `
    <div class="nb-head">
      <div class="eyebrow">${book.isExample ? `<span class="pill example">Example</span>` : ""}${book.summary ? `<span class="pill ok">${pend ? pend + " new since summary" : "Summary up to date"}</span>` : `<span class="pill info">No summary yet</span>`}</div>
      <h2>${esc(book.title)}</h2>
      ${book.author ? `<div class="author">${esc(book.author)}</div>` : ""}
    </div>
    <nav class="tabs" role="tablist">
      ${[["resumen", "Summary"], ["subrayados", `Highlights (${book.highlights.length})`], ["agregar", "Add"]].map(([k, l]) =>
        `<button class="tab ${S.tab === k ? "active" : ""}" role="tab" aria-selected="${S.tab === k}" data-tab="${k}">${l}</button>`).join("")}
    </nav>
    <div class="nb-body">${body}</div>`;
}

/* ---------- Eventos ---------- */
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-book],[data-tab],[data-act],[data-flip],[data-del],[data-import]");
  if (!t) return;
  if (t.dataset.book) { S.currentId = t.dataset.book; S.newBook = null; S.found = null; S.confirmDelete = null; if (S.tab === "agregar" && t.dataset.book === "ejemplo") S.tab = "resumen"; render(); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); return; }
  if (t.dataset.flip) { S.flipped[t.dataset.flip] = !S.flipped[t.dataset.flip]; render(); return; }
  const book = current();
  if (t.dataset.del) {
    book.highlights = book.highlights.filter(h => h.id !== t.dataset.del);
    book.summarized = book.summarized.filter(id => id !== t.dataset.del);
    persist(book); render(); return;
  }
  if (t.dataset.import != null) {
    const f = S.found?.[+t.dataset.import]; if (!f) return;
    let target = findBookByTitle(f.title);
    if (!target) { target = makeBook(f.title, f.author, ""); S.books[target.id] = target; }
    const n = addHighlights(target, f.items);
    persist(target);
    S.currentId = target.id; S.found = null; S.newBook = null; S.tab = n ? "resumen" : "subrayados";
    toast(n ? `${n} highlight${n === 1 ? "" : "s"} added to “${target.title}”.` : "There were no new highlights.");
    render(); return;
  }
  switch (t.dataset.act) {
    case "new-book": S.newBook = { raw: "", title: "", author: "", needTitle: false }; S.found = null; render(); setTimeout(() => $("#nb-raw")?.focus(), 0); break;
    case "cancel-new": S.newBook = null; S.found = null; saveDraft(); render(); break;
    case "gen-full": generate("full"); break;
    case "gen-update": generate("update"); break;
    case "stop": S.gen?.ctl.abort(); break;
    case "delete-ask": S.confirmDelete = book.id; render(); break;
    case "delete-no": S.confirmDelete = null; render(); break;
    case "delete-yes": S.confirmDelete = null; await removeBook(book.id); S.currentId = bookList()[0]?.id || null; S.tab = "resumen"; render(); toast("Book deleted."); break;
    case "add-paste": {
      const raw = S.draft.trim(); if (!raw) { toast("Paste at least one highlight."); return; }
      const parsed = parsePasted(raw);
      if (!parsed) { S.found = parseClippings(raw); S.draft = ""; saveDraft(); render(); return; }
      const { target, n } = importParsed(parsed, book);
      S.draft = ""; saveDraft(); render();
      toast(n ? `${n} highlight${n > 1 ? "s" : ""} added to “${target.title}”.` : "Those highlights were already saved.");
      break;
    }
    case "copy": {
      const md = summaryMarkdown(book);
      try { await navigator.clipboard.writeText(md); toast("Summary copied. Paste it into your notes."); }
      catch (err) { const ta = document.createElement("textarea"); ta.value = md; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("Summary copied."); } catch (e2) { toast("Couldn't copy."); } ta.remove(); }
      break;
    }
  }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.action != null) {
    const book = current(); book.done = book.done || {};
    if (el.checked) book.done[el.dataset.action] = true; else delete book.done[el.dataset.action];
    persist(book); render();
  } else if (el.hasAttribute("data-goal")) {
    const book = current(); if (book.isExample) return;
    book.goal = el.value.trim(); persist(book);
  } else if (el.dataset.shots && el.files.length) {
    readScreens(Array.from(el.files), el.dataset.shots);
  } else if (el.id === "file" && el.files[0]) {
    readFile(el.files[0]);
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "paste") S.draft = e.target.value;
  if (S.newBook && e.target.id?.startsWith("nb-")) S.newBook[e.target.id.slice(3)] = e.target.value;
  if (e.target.id === "paste" || e.target.id === "nb-raw") saveDraft();
});
/* Al pegar al final de lo que ya hay, deja una línea en blanco: así cada destacado queda separado. */
document.addEventListener("paste", (e) => {
  const ta = e.target;
  if (ta.id !== "paste" && ta.id !== "nb-raw") return;
  const text = e.clipboardData?.getData("text/plain");
  if (!text || !ta.value.trim() || ta.selectionStart !== ta.value.length) return;
  e.preventDefault();
  const sep = /\n\s*\n\s*$/.test(ta.value) ? "" : /\n\s*$/.test(ta.value) ? "\n" : "\n\n";
  ta.setRangeText(sep + text.trim() + "\n\n", ta.value.length, ta.value.length, "end");
  ta.dispatchEvent(new Event("input", { bubbles: true }));
  ta.scrollTop = ta.scrollHeight;
});
/* Lo que llevas pegado sobrevive si el iPad recarga la página al cambiar de app. */
const DRAFT_KEY = "subrayados.borrador";
function saveDraft() {
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ paste: S.draft, raw: S.newBook ? S.newBook.raw : "", book: S.currentId })); } catch (e) {}
}
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); if (!d) return;
    if (d.raw) { S.newBook = { raw: d.raw, title: "", author: "", needTitle: false }; }
    else if (d.paste) { S.draft = d.paste; S.currentId = d.book || null; S.tab = "agregar"; }
  } catch (e) {}
}
document.addEventListener("submit", (e) => {
  if (e.target.id !== "new-form") return;
  e.preventDefault();
  const nb = S.newBook, raw = nb.raw.trim();
  if (!raw && !nb.pending) { toast("Paste at least one highlight or upload screenshots."); return; }
  const parsed = raw ? parsePasted(raw) : { items: [], title: "", author: "" };
  if (parsed && nb.pending) parsed.items.push(...nb.pending);
  if (!parsed) { S.found = parseClippings(raw); render(); return; }
  if (!parsed.title && !nb.title.trim()) { nb.needTitle = true; render(); setTimeout(() => $("#nb-title")?.focus(), 0); return; }
  if (!parsed.title) { parsed.title = nb.title.trim(); parsed.author = parsed.author || nb.author.trim(); }
  const { target, n } = importParsed(parsed, null);
  S.newBook = null; S.found = null; S.tab = "resumen"; saveDraft(); render();
  toast(`${n} highlight${n === 1 ? "" : "s"} in “${target.title}”${target.author ? " by " + target.author : ""}.`);
});
/* Capturas de la lista de destacados: Claude transcribe el texto de cada destacado. */
const SHOTS_PROMPT = `These images are screenshots from a reading app (usually Books / Apple Books on iPad) showing highlights from a book.
Transcribe the EXACT text of each highlight, word for word, in its original language, without summarizing or correcting.
- Ignore menus, buttons, dates, times, system bars and stray page numbers.
- If you see a highlight's chapter, put it in "capitulo". If the reader wrote a note, put it in "nota".
- If a highlight is cut off at the edge of a screenshot, include only the visible part.
- If the book's title or author is visible, include them; otherwise leave "".
Reply only with JSON (keep these keys): {"titulo":"","autor":"","destacados":[{"texto":"","capitulo":"","nota":""}]}`;
async function readScreens(files, where) {
  if (!S.sample || S.reading) return;
  const lim = await S.sample.limits().catch(() => null);
  const max = Math.max(1, lim?.images?.maxCount || 1);
  const okTypes = lim?.images?.mediaTypes;
  files = files.filter(f => !okTypes || okTypes.includes(f.type) || /^image\//.test(f.type));
  if (!files.length) { toast("Choose images (screenshots)."); return; }
  S.reading = { done: 0, total: files.length }; render();
  const parsed = { items: [], title: "", author: "" };
  let failed = 0;
  try {
    for (let i = 0; i < files.length; i += max) {
      const chunk = files.slice(i, i + max);
      try {
        const r = await S.sample.json(SHOTS_PROMPT, { images: chunk });
        if (r && typeof r === "object") {
          parsed.title = parsed.title || String(r.titulo || "").trim();
          parsed.author = parsed.author || String(r.autor || "").trim();
          for (const d of Array.isArray(r.destacados) ? r.destacados : []) {
            const text = String(d?.texto || "").trim(); if (!text) continue;
            parsed.items.push({ text, loc: d.capitulo ? "Ch. " + String(d.capitulo).trim() : "", note: String(d.nota || "").trim() });
          }
        }
      } catch (e) {
        const code = e && e.code;
        if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed", "images_unavailable"].includes(code)) { S.imgOK = false; toast(ERR[code] || "This viewer can't send images to Claude."); break; }
        if (code === "rate_limited" || code === "session_expired") { toast(ERR[code]); break; }
        failed += chunk.length;
      }
      S.reading.done = Math.min(files.length, i + chunk.length);
      const pr = $("#read-progress"); if (pr) pr.textContent = S.reading.done + " of " + S.reading.total;
    }
  } finally { S.reading = null; }
  if (!parsed.items.length) { render(); toast(failed ? "Couldn't read the screenshots. Try again." : "We found no highlights in those screenshots."); return; }
  if (where === "new" && S.newBook) {
    if (!parsed.title && !S.newBook.title.trim()) {
      S.newBook.pending = parsed.items; S.newBook.needTitle = true; render();
      setTimeout(() => $("#nb-title")?.focus(), 0); return;
    }
    if (!parsed.title) { parsed.title = S.newBook.title.trim(); parsed.author = parsed.author || S.newBook.author.trim(); }
    const { target, n } = importParsed(parsed, null);
    S.newBook = null; S.tab = "resumen"; saveDraft(); render();
    toast(`${n} highlight${n === 1 ? "" : "s"} read into “${target.title}”.${failed ? " Some screenshots couldn't be read." : ""}`);
  } else {
    const { target, n } = importParsed(parsed, current());
    S.tab = "resumen"; render();
    toast(n ? `${n} new highlight${n === 1 ? "" : "s"} in “${target.title}”.` : "Those highlights were already saved.");
  }
}
function readFile(file) {
  const r = new FileReader();
  r.onload = () => { S.found = parseClippings(String(r.result || "")); render(); };
  r.onerror = () => toast("Couldn't read the file.");
  r.readAsText(file);
}
["dragover", "dragleave", "drop"].forEach(type => document.addEventListener(type, (e) => {
  const d = e.target.closest?.("#drop"); if (!d) return;
  e.preventDefault();
  d.classList.toggle("over", type === "dragover");
  if (type === "drop" && e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
}));

/* ---------- Arranque ---------- */
S.books = loadLocal();
loadDraft();
render();

(async () => {
  const cl = window.claude;
  const [user, db, sample] = cl?.use ? await Promise.all([cl.use("user"), cl.use("db"), cl.use("sample")].map(p => p.catch(() => null))) : [null, null, null];
  S.sample = sample;
  if (sample) { const lim = await sample.limits().catch(() => null); S.imgOK = !!lim?.images; }
  const uid = user ? await user.id() : null;
  if (!db || !uid) { S.mode = "local"; render(); return; }
  S.db = db; S.uid = uid;
  const local = S.books;
  let first = true;
  col().onSnapshot((snap) => {
    const remote = {};
    snap.docs.forEach(d => { const v = d.data(); if (v) remote[d.id] = JSON.parse(JSON.stringify(v)); });
    if (first) {
      first = false; S.mode = "cuenta";
      // Si ya usabas la página sin cuenta, sube esos libros una vez.
      const toUpload = Object.values(local).filter(b => !remote[b.id]);
      S.books = remote;
      toUpload.forEach(b => { S.books[b.id] = b; dirty[b.id] = true; flush(b.id); });
      if (toUpload.length) { try { localStorage.removeItem(LS_KEY); } catch (e) {} }
      render(); return;
    }
    let changed = false;
    for (const [id, v] of Object.entries(remote)) {
      if (dirty[id] || timers[id] && S.books[id] && S.books[id].updatedAt > (v.updatedAt || 0)) continue;
      if (!S.books[id] || (v.updatedAt || 0) > (S.books[id].updatedAt || 0)) { S.books[id] = v; changed = true; }
    }
    for (const id of Object.keys(S.books)) if (!remote[id] && !dirty[id] && !timers[id]) { delete S.books[id]; changed = true; }
    const typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if (changed && !typing && !S.gen) render();
  }, () => { S.mode = "local"; S.books = loadLocal(); render(); });
})();
})();
</script>
